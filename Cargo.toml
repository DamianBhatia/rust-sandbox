[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"
description = "A from-scratch Linux container sandbox"
license = "MIT"
authors = ["Damian Bhatia"]
repository = "https://github.com/DamianBhatia/rust-sandbox"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "process", "signal"] }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
